<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="910" viewBox="0 0 1200 910" role="img" aria-labelledby="title desc"><title id="title">Wardriver mobile rig wiring</title><desc id="desc">Choose one 100 watt power source for the hub. Three Wi-Fi radios connect to the hub. Bluetooth and GPS connect directly to the Dell. Hub host cable carries data and laptop charging.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#be842b"/></marker></defs><rect width="1200" height="910" fill="#f8fafc"/><text x="38" y="48" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#0f172a">WARDRIVER.ORG / MOBILE KISMET RIG</text><text x="38" y="80" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#334155">Current hardware • planned connections • validation pending</text><rect x="38" y="112" width="430" height="94" rx="12" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="142" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="600" fill="#0f172a">Vehicle: Anker Nano 167.5W</text><text x="56" y="170" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#334155">Use USB-C1: up to 100W</text><rect x="732" y="112" width="430" height="94" rx="12" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="750" y="142" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="600" fill="#0f172a">AC: Anker Prime 100W</text><text x="750" y="170" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#334155">Use a USB-C port with 100W available</text><path d="M468 160 H600 V260" fill="none" stroke="#be842b" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrow)"/><path d="M732 160 H600" fill="none" stroke="#be842b" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrow)"/><text x="490" y="225" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#94621d">Choose ONE source</text><rect x="380" y="270" width="440" height="145" rx="12" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="398" y="300" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="600" fill="#0f172a">Anker 7-in-1 USB-C hub</text><text x="398" y="328" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#334155">PD-IN: 5A / 100W+ USB-C cable</text><text x="398" y="353" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#334155">Data: 2 × USB-A + 1 × USB-C</text><text x="398" y="378" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#334155">Up to 85W laptop passthrough¹</text><rect x="38" y="490" width="340" height="126" rx="12" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="520" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="600" fill="#0f172a">Radio 1: AWUS036AC?</text><text x="56" y="548" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#334155">Planned 2.4 GHz</text><text x="56" y="573" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#334155">2 × Bingfu magnetic antennas</text><text x="56" y="598" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#334155">Confirm first radio model label</text><rect x="430" y="490" width="340" height="126" rx="12" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="448" y="520" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="600" fill="#0f172a">ALFA AWUS1900</text><text x="448" y="548" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#334155">Planned 5 GHz</text><text x="448" y="573" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#334155">4 × stock ALFA antennas</text><rect x="822" y="490" width="340" heigh